apiVersion: v1
kind: Service
metadata:
  name: myapp-service
spec:
  selector:
    app: myapp                        # Matches pods with label app=myapp
  type: ClusterIP                     # Internal access only (use NodePort/LoadBalancer to expose externally)
  ports:
    - protocol: TCP
      port: 80                        # Port the service listens on
      targetPort: 80                  # Port on the pod to forward to
